spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://10.0.0.10:3306/jcms_prod?useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Seoul
    username: prod_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect

jcms:
  file:
    upload-path: /var/www/jcms/uploads/
  resource:
    minification-enabled: true

logging:
  level:
    root: info
    com.jcms: warn

error-purifier:
  admin:
    token: ${ERROR_PURIFIER_ADMIN_TOKEN:}
  rate-limit:
    daily-limit: 100
    burst-limit: 10
    burst-window-seconds: 60
