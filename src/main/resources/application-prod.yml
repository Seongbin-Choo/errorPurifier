spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    root: info
    com.errorpurifier: info

error-purifier:
  admin:
    token: ${ERROR_PURIFIER_ADMIN_TOKEN:}
  rate-limit:
    daily-limit: 100
    burst-limit: 10
    burst-window-seconds: 60
