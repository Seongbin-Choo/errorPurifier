spring:
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:errorpurifier;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.H2Dialect

error-purifier:
  admin:
    token: test-admin-token
