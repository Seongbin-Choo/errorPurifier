plugins {
    id 'java'
    id 'java-test-fixtures'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'com.errorPurifier'
version = '0.0.1-SNAPSHOT'
description = 'errorPurifier'

// Spring Boot 4.1.1 manages Tomcat 11.0.24; 11.0.25 contains the 2026 security fixes.
ext['tomcat.version'] = '11.0.25'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testFixturesImplementation 'jakarta.persistence:jakarta.persistence-api'
    jmhImplementation(testFixtures(project()))
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
}

jmh {
    warmupIterations = 2
    iterations = 3
    fork = 1
    benchmarkMode = ['avgt']
    timeUnit = 'ms'
    timeOnIteration = '1s'
    warmup = '1s'
    includes = ['LogPromptRefinerBenchmark']
}

tasks.register('jmhMetrics', JavaExec) {
    group = 'benchmark'
    description = 'Prints deterministic input and refinement-size metrics used alongside JMH results.'
    dependsOn tasks.named('jmhClasses')
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'com.errorpurifier.benchmark.LogRefinementMetrics'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'error-purifier.jar'
}
